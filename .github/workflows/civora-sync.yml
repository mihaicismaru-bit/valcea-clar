name: VÂLCEA CLAR — CIVORA Public Sync

on:
  workflow_dispatch:
  schedule:
    # GitHub cron delivery is best-effort. Two off-peak lightweight probes per
    # hour reduce missed-delta latency; the expensive sync/build/deploy job runs
    # only when CIVORA or the public readback actually differs.
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'sync/run-now'
      - 'scripts/check_civora_projection_ready.py'
      - 'scripts/sync_civora.py'
      - 'scripts/build.py'
      - 'scripts/history_projection.py'
      - 'scripts/enrich_metadata.py'
      - 'scripts/verify.py'
      - 'scripts/media_assets.py'
      - 'scripts/readback_media.py'
      - 'content/site.css'
      - 'content/site.json'
      - 'content/legal.json'
      - 'content/media.json'
      - 'media_source/**'
      - '.github/workflows/civora-sync.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: valcea-clar-civora-public-sync
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.probe.outputs.run }}
      reason: ${{ steps.probe.outputs.reason }}
    steps:
      - id: probe
        name: Probe CIVORA delta and public readback
        shell: bash
        run: |
          set -euo pipefail

          # Structural/manual events always execute the full validated path.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo 'reason=explicit_or_structural_event' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream='https://raw.githubusercontent.com/mihaicismaru-bit/civora/main/valcea-clar/site'
          local_state="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/sync/civora_state.json"

          # A transient upstream/public transport failure is a reason to run the
          # canonical fail-closed job, not a reason to report a false no-op.
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$upstream/runtime/live-feed.json?probe=${GITHUB_RUN_ID}" -o /tmp/feed.json || true
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$upstream/public_ux_state.json?probe=${GITHUB_RUN_ID}" -o /tmp/ux.json || true
          curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$local_state?probe=${GITHUB_RUN_ID}" -o /tmp/local.json || true
          curl -fsSL --max-time 25 "https://valceaclar.ro/?sync_probe=${GITHUB_RUN_ID}" -o /tmp/live-home.html || true
          curl -fsSL --max-time 25 "https://valceaclar.ro/sitemap.xml?sync_probe=${GITHUB_RUN_ID}" -o /tmp/live-sitemap.xml || true

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          out = Path(os.environ['GITHUB_OUTPUT'])

          def load(path):
              p = Path(path)
              if not p.is_file() or not p.read_text(encoding='utf-8', errors='replace').strip():
                  return None
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  return None

          feed = load('/tmp/feed.json')
          ux = load('/tmp/ux.json')
          local = load('/tmp/local.json')
          if not all(isinstance(x, dict) for x in (feed, ux, local)):
              out.write_text('run=true\nreason=probe_input_unavailable\n', encoding='utf-8')
              raise SystemExit(0)

          stories = [row for row in feed.get('stories', []) if isinstance(row, dict) and row.get('id')]
          feed_ids = {str(row['id']) for row in stories}
          ux_ids = {str(value) for value in ux.get('story_ids', []) if value}
          live_count = int(ux.get('live_story_count') or 0)
          upstream_ready = bool(stories) and len(stories) == live_count and feed_ids == ux_ids
          if not upstream_ready:
              # Let the canonical readiness gate decide fail-closed; do not
              # waste a full build while CIVORA is visibly mid-transaction.
              out.write_text('run=false\nreason=upstream_projection_not_ready\n', encoding='utf-8')
              raise SystemExit(0)

          expected_id = str(ux.get('story_ids', [''])[0] or '')
          delta = (
              str(feed.get('generated_at') or '') != str(local.get('source_generated_at') or '')
              or len(stories) != int(local.get('story_count') or 0)
              or expected_id != str(local.get('lead_story_id') or '')
          )

          home = Path('/tmp/live-home.html').read_text(encoding='utf-8', errors='replace') if Path('/tmp/live-home.html').is_file() else ''
          sitemap = Path('/tmp/live-sitemap.xml').read_text(encoding='utf-8', errors='replace') if Path('/tmp/live-sitemap.xml').is_file() else ''
          live_routes = set(re.findall(r'https?://[^<]+(/stiri/[^<]+/)</loc>', sitemap))
          public_mismatch = (
              not home
              or not sitemap
              or not expected_id
              or f'/stiri/{expected_id}/' not in home
              or live_routes != {f'/stiri/{story_id}/' for story_id in feed_ids}
          )

          if delta:
              reason = 'civora_delta'
          elif public_mismatch:
              reason = 'public_readback_mismatch'
          else:
              reason = 'no_delta'
          run = delta or public_mismatch
          out.write_text(f"run={'true' if run else 'false'}\nreason={reason}\n", encoding='utf-8')
          print({'run': run, 'reason': reason, 'story_count': len(stories), 'lead': expected_id})
          PY

  sync-build-deploy:
    needs: probe
    if: needs.probe.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require completed CIVORA derived public projection
        run: python3 scripts/check_civora_projection_ready.py

      - name: Sync canonical CIVORA feed
        run: python3 scripts/sync_civora.py

      - id: state
        name: Determine whether public deployment is needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/articles.json; then
            changed=false
          else
            changed=true
          fi
          expected_id="$(python3 - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('content/articles.json').read_text(encoding='utf-8'))
          print(doc['articles'][0]['id'])
          PY
          )"

          # Public truth is the complete canonical story set, not merely the
          # presence of the current lead. This prevents a held/removed story
          # from remaining live while the workflow reports a false green.
          live_ok=false
          story_set_ok=false
          if curl -fsSL --max-time 25 "https://valceaclar.ro/?sync_probe=$(date +%s)" -o /tmp/live-home.html \
            && curl -fsSL --max-time 25 "https://valceaclar.ro/sitemap.xml?sync_probe=$(date +%s)" -o /tmp/live-sitemap.xml; then
            if grep -Fq "/stiri/${expected_id}/" /tmp/live-home.html; then
              if python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          doc=json.loads(Path('content/articles.json').read_text(encoding='utf-8'))
          expected={f"/stiri/{row['id']}/" for row in doc.get('articles',[]) if isinstance(row,dict) and row.get('id')}
          xml=Path('/tmp/live-sitemap.xml').read_text(encoding='utf-8', errors='replace')
          live=set(re.findall(r'https?://[^<]+(/stiri/[^<]+/)</loc>', xml))
          if live != expected:
              missing=sorted(expected-live)
              extra=sorted(live-expected)
              print({'status':'MISMATCH','expected':len(expected),'live':len(live),'missing':missing[:10],'extra':extra[:10]})
              raise SystemExit(1)
          print({'status':'PASS','story_count':len(expected)})
          PY
              then
                story_set_ok=true
                live_ok=true
              fi
            fi
          fi

          history_expected="$(python3 scripts/history_projection.py --probe)"
          history_live_ok=true
          if [ -n "$history_expected" ]; then
            history_live_ok=false
            if curl -fsSL --max-time 25 "https://valceaclar.ro${history_expected}?history_probe=$(date +%s)" -o /tmp/live-history.html; then
              if grep -Fq "EDIȚIE ISTORICĂ RECONSTRUITĂ" /tmp/live-history.html; then
                history_live_ok=true
              fi
            fi
          fi

          structural=false
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.event.head_commit.message }}" != 'sync: reconcile CIVORA canonical stories' ]; then
            structural=true
          fi
          deploy=false
          if [ "$changed" = true ] || [ "$live_ok" != true ] || [ "$history_live_ok" != true ] || [ "$structural" = true ]; then
            deploy=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "live_ok=$live_ok" >> "$GITHUB_OUTPUT"
          echo "story_set_ok=$story_set_ok" >> "$GITHUB_OUTPUT"
          echo "history_live_ok=$history_live_ok" >> "$GITHUB_OUTPUT"
          echo "history_expected=$history_expected" >> "$GITHUB_OUTPUT"
          echo "structural=$structural" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "expected_id=$expected_id" >> "$GITHUB_OUTPUT"
          echo "content_changed=$changed live_ok=$live_ok story_set_ok=$story_set_ok history_live_ok=$history_live_ok structural=$structural deploy=$deploy expected_id=$expected_id history_expected=$history_expected"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build production site
        run: python3 scripts/build.py

      - name: Validate historical projection contract
        run: python3 scripts/history_projection.py --self-test

      - name: Project released historical editions
        run: python3 scripts/history_projection.py

      - name: Enrich discovery and social metadata
        run: python3 scripts/enrich_metadata.py

      - name: Verify production artifact
        run: python3 scripts/verify.py

      - uses: actions/configure-pages@v5
        if: steps.state.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.state.outputs.deploy == 'true'
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.state.outputs.deploy == 'true'

      - name: Public readback of canonical lead
        shell: bash
        run: |
          set -euo pipefail
          expected_id='${{ steps.state.outputs.expected_id }}'
          ok=0
          for i in $(seq 1 15); do
            if curl -fsSL --max-time 25 "https://valceaclar.ro/?readback=$(date +%s)" -o /tmp/home.html \
              && grep -Fq "/stiri/${expected_id}/" /tmp/home.html \
              && curl -fsSL --max-time 25 "https://valceaclar.ro/stiri/${expected_id}/?readback=$(date +%s)" -o /tmp/story.html \
              && grep -q '<h1>' /tmp/story.html; then
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" != 1 ]; then
            echo "Public readback failed for canonical lead: $expected_id" >&2
            exit 1
          fi
          echo "Public readback PASS: $expected_id"

      - name: Public readback of exact canonical story set
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 15); do
            if curl -fsSL --max-time 25 "https://valceaclar.ro/sitemap.xml?story_set_readback=$(date +%s)" -o /tmp/readback-sitemap.xml; then
              if python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          doc=json.loads(Path('content/articles.json').read_text(encoding='utf-8'))
          expected={f"/stiri/{row['id']}/" for row in doc.get('articles',[]) if isinstance(row,dict) and row.get('id')}
          xml=Path('/tmp/readback-sitemap.xml').read_text(encoding='utf-8', errors='replace')
          live=set(re.findall(r'https?://[^<]+(/stiri/[^<]+/)</loc>', xml))
          if live != expected:
              print({'status':'MISMATCH','expected':len(expected),'live':len(live),'missing':sorted(expected-live)[:10],'extra':sorted(live-expected)[:10]})
              raise SystemExit(1)
          print({'status':'PASS','story_count':len(expected)})
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 8
          done
          if [ "$ok" != 1 ]; then
            echo 'Public story-set readback failed: live sitemap does not equal canonical article set.' >&2
            exit 1
          fi
          echo 'Public story-set readback PASS.'

      - name: Public readback of historical archive
        shell: bash
        run: |
          set -euo pipefail
          history_expected='${{ steps.state.outputs.history_expected }}'
          if [ -z "$history_expected" ]; then
            echo 'Historical projection not active.'
            exit 0
          fi
          ok=0
          for i in $(seq 1 15); do
            if curl -fsSL --max-time 25 "https://valceaclar.ro${history_expected}?readback=$(date +%s)" -o /tmp/history.html \
              && grep -Fq "EDIȚIE ISTORICĂ RECONSTRUITĂ" /tmp/history.html; then
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" != 1 ]; then
            echo "Public readback failed for historical route: $history_expected" >&2
            exit 1
          fi
          echo "Historical public readback PASS: $history_expected"

      - name: Public readback of verified CIVORA media
        run: python3 scripts/readback_media.py

      - name: Persist canonical projection state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'valcea-clar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content/articles.json sync/civora_state.json
          if git diff --cached --quiet; then
            echo 'Canonical projection unchanged.'
            exit 0
          fi
          git commit -m 'sync: reconcile CIVORA canonical stories'
          git restore --worktree .
          git clean -fd -- _site
          git pull --rebase origin main
          git push origin HEAD:main
