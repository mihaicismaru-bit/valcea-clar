name: deploy-pages-preview
on:
  push:
    branches: [main]
    paths:
      - '.github/preview-deploy-trigger'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VALCEA_CLAR_BASE_PATH: /valcea-clar
      VALCEA_CLAR_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build preview
        run: python3 scripts/build.py
      - name: Verify preview routes and local media
        run: python3 scripts/verify.py
      - name: Assert preview safety
        run: |
          test ! -f _site/CNAME
          grep -q 'noindex,nofollow' _site/index.html
          grep -q 'href="/valcea-clar/stiri/"' _site/index.html
          grep -q 'Disallow: /' _site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
