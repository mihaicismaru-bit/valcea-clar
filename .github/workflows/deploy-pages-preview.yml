name: deploy-pages-preview
on:
  push:
    branches: [main]
    paths:
      - '.github/preview-deploy-trigger'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VALCEA_CLAR_BASE_PATH: /valcea-clar
      VALCEA_CLAR_PREVIEW: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build preview
        run: python3 scripts/build.py
      - name: Verify preview routes and local media
        run: python3 scripts/verify.py
      - name: Assert preview safety
        run: |
          test ! -f _site/CNAME
          grep -q 'noindex,nofollow' _site/index.html
          grep -q 'href="/valcea-clar/stiri/"' _site/index.html
          grep -q 'Disallow: /' _site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed preview over HTTP
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}/"
          ok=0
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 15 "$SITE_URL" -o /tmp/home.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          grep -q 'VÂLCEA CLAR' /tmp/home.html
          grep -q 'noindex,nofollow' /tmp/home.html
          grep -q 'href="/valcea-clar/stiri/"' /tmp/home.html
          ! grep -q 'ChatGPT Sites' /tmp/home.html
          ! grep -q 'Unde ieșim' /tmp/home.html
          curl -fsSL --max-time 15 "${SITE_URL}stiri/" -o /tmp/stiri.html
          grep -q '<h1>Știri</h1>' /tmp/stiri.html
          curl -fsSL --max-time 15 "${SITE_URL}stiri/buila-vanturarita-accident-20260822/" -o /tmp/article.html
          grep -q 'Buila' /tmp/article.html
          curl -fsSL --max-time 15 "${SITE_URL}assets/site.css" -o /tmp/site.css
          test -s /tmp/site.css
          curl -fsSL --max-time 15 "${SITE_URL}robots.txt" -o /tmp/robots.txt
          grep -q 'Disallow: /' /tmp/robots.txt
      - name: Persist verified preview marker
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          git config user.name 'valcea-clar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B preview-status origin/main
          printf 'status=VERIFIED_PREVIEW\nurl=%s\nsource_sha=%s\nverified_at=%s\n' "$SITE_URL" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/preview-deploy-status
          git add .github/preview-deploy-status
          git commit -m 'ops: record verified Pages preview'
          git push origin HEAD:main
