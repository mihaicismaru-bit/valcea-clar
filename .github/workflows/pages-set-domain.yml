name: pages-set-domain
on:
  push:
    branches: [main]
    paths:
      - '.github/pages-set-domain-trigger'
permissions:
  contents: write
  pages: write
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set custom domain in Pages API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo 'status=SET_DOMAIN'
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '[PUT]'
            curl -sS -D /tmp/put-h -X PUT -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/${GITHUB_REPOSITORY}/pages -d '{"cname":"valceaclar.ro","build_type":"workflow"}' -o /tmp/put-b
            head -1 /tmp/put-h
            cat /tmp/put-b
            echo
            echo '[GET]'
            curl -sS -D /tmp/get-h -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/${GITHUB_REPOSITORY}/pages -o /tmp/get-b
            head -1 /tmp/get-h
            cat /tmp/get-b
            echo
          } > /tmp/pages-set-domain 2>&1
          cat /tmp/pages-set-domain
      - name: Persist result
        if: always()
        run: |
          git config user.name 'valcea-clar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B pages-domain-status origin/main
          cp /tmp/pages-set-domain .github/pages-set-domain-status
          git add .github/pages-set-domain-status
          git commit -m 'ops: record Pages custom-domain configuration'
          git push origin HEAD:main
