name: pages-state
on:
  push:
    branches: [main]
    paths:
      - '.github/pages-state-trigger'
permissions:
  contents: write
  pages: write
jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Pages API state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo 'status=PAGES_STATE'
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '[PAGES]'
            curl -sS -D /tmp/pages-h -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/${GITHUB_REPOSITORY}/pages -o /tmp/pages-b
            head -1 /tmp/pages-h
            cat /tmp/pages-b
            echo
            echo '[HEALTH]'
            curl -sS -D /tmp/health-h -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/health -o /tmp/health-b
            head -1 /tmp/health-h
            cat /tmp/health-b
            echo
          } > /tmp/pages-state 2>&1
          cat /tmp/pages-state
      - name: Persist Pages state
        if: always()
        run: |
          git config user.name 'valcea-clar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B pages-state-status origin/main
          cp /tmp/pages-state .github/pages-state-status
          git add .github/pages-state-status
          git commit -m 'ops: record Pages API state'
          git push origin HEAD:main
