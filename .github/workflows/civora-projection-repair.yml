name: VÂLCEA CLAR — CIVORA Projection Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sync/run-now'
      - 'scripts/reconcile_civora_currentness_events.py'
      - '.github/workflows/civora-projection-repair.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: valcea-clar-civora-public-sync
  cancel-in-progress: false

jobs:
  reconcile-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require completed CIVORA public projection
        run: python3 scripts/check_civora_projection_ready.py

      - name: Sync canonical CIVORA stories
        run: python3 scripts/sync_civora.py

      - name: Validate currentness and Local Life reconciler
        run: python3 scripts/reconcile_civora_currentness_events.py --self-test

      - name: Reconcile current stories and structured events
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile_civora_currentness_events.py | tee /tmp/reconcile.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          doc=json.loads(Path('/tmp/reconcile.json').read_text(encoding='utf-8').splitlines()[-1])
          print(f"lead={doc['current'][0]}")
          print(f"current_count={len(doc['current'])}")
          print(f"event_count={len(doc['events'])}")
          PY

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Build production site
        run: python3 scripts/build.py

      - name: Project released historical editions
        run: |
          python3 scripts/history_projection.py --self-test
          python3 scripts/history_projection.py

      - name: Enrich discovery and social metadata
        run: python3 scripts/enrich_metadata.py

      - name: Verify production artifact
        run: python3 scripts/verify.py

      - name: Assert repaired artifact before deployment
        env:
          EXPECTED_LEAD: ${{ steps.reconcile.outputs.lead }}
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "/stiri/${EXPECTED_LEAD}/" _site/index.html
          grep -Fq 'O noapte furtunoasă' _site/unde-iesim/index.html
          grep -Fq 'Drăgășani' _site/unde-iesim/index.html
          grep -Fq 'Fragmente de sine' _site/unde-iesim/index.html
          grep -Fq 'stARTiști vâlceni' _site/unde-iesim/index.html
          test -s _site/sitemap.xml

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Public readback of repaired lead and Local Life inventory
        env:
          EXPECTED_LEAD: ${{ steps.reconcile.outputs.lead }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 15); do
            probe=$(date +%s)
            if curl -fsSL --max-time 25 "https://valceaclar.ro/?repair_readback=$probe" -o /tmp/home.html \
              && curl -fsSL --max-time 25 "https://valceaclar.ro/unde-iesim/?repair_readback=$probe" -o /tmp/events.html \
              && curl -fsSL --max-time 25 "https://valceaclar.ro/sitemap.xml?repair_readback=$probe" -o /tmp/sitemap.xml \
              && grep -Fq "/stiri/${EXPECTED_LEAD}/" /tmp/home.html \
              && grep -Fq 'O noapte furtunoasă' /tmp/events.html \
              && grep -Fq 'Drăgășani' /tmp/events.html \
              && grep -Fq 'Fragmente de sine' /tmp/events.html \
              && grep -Fq 'stARTiști vâlceni' /tmp/events.html; then
              ok=1
              break
            fi
            sleep 8
          done
          if [ "$ok" != 1 ]; then
            echo 'Public readback failed for repaired lead or Local Life inventory.' >&2
            exit 1
          fi
          echo "Public repair readback PASS lead=${EXPECTED_LEAD}"

      - name: Persist reconciled projection only after readback
        shell: bash
        run: |
          set -euo pipefail
          cp content/articles.json /tmp/articles.json
          cp content/events.json /tmp/events.json
          cp sync/civora_state.json /tmp/civora_state.json
          git config user.name 'valcea-clar-bot'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/articles.json content/articles.json
            cp /tmp/events.json content/events.json
            cp /tmp/civora_state.json sync/civora_state.json
            git add content/articles.json content/events.json sync/civora_state.json
            if git diff --cached --quiet; then
              echo 'Repaired public projection already persisted.'
              exit 0
            fi
            git commit -m 'sync: reconcile CIVORA currentness and Local Life'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
