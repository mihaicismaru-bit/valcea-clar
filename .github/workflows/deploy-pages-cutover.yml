name: deploy-pages-cutover
on:
  push:
    branches: [main]
    paths:
      - '.github/cutover-trigger'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-cutover
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: https://valceaclar.ro/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build production
        run: python3 scripts/build.py
      - name: Verify production artifact
        run: python3 scripts/verify.py
      - name: Assert production safety
        run: |
          set -euo pipefail
          ! grep -q 'noindex,nofollow' _site/index.html
          grep -q 'href="/stiri/"' _site/index.html
          grep -q 'Allow: /' _site/robots.txt
          grep -q 'https://valceaclar.ro/sitemap.xml' _site/robots.txt
          ! grep -q 'ChatGPT Sites' _site/index.html
          ! grep -q 'Unde ieșim' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify valceaclar.ro over HTTPS
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            if curl -fsSL --max-time 20 https://valceaclar.ro/ -o /tmp/home.html; then
              if grep -q 'VÂLCEA CLAR — Știri din Vâlcea' /tmp/home.html; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" = 1
          ! grep -q 'noindex,nofollow' /tmp/home.html
          ! grep -q 'Unde ieșim' /tmp/home.html
          curl -fsSL --max-time 20 https://valceaclar.ro/stiri/ -o /tmp/stiri.html
          grep -q '<h1>Știri</h1>' /tmp/stiri.html
          curl -fsSL --max-time 20 https://valceaclar.ro/stiri/buila-vanturarita-accident-20260822/ -o /tmp/article.html
          grep -q 'Buila' /tmp/article.html
          curl -fsSL --max-time 20 https://valceaclar.ro/assets/site.css -o /tmp/site.css
          test -s /tmp/site.css
          curl -fsSL --max-time 20 https://valceaclar.ro/robots.txt -o /tmp/robots.txt
          grep -q 'Allow: /' /tmp/robots.txt
      - name: Persist verified cutover marker
        run: |
          set -euo pipefail
          git config user.name 'valcea-clar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B cutover-status origin/main
          printf 'status=VERIFIED_PRODUCTION_CUTOVER\nurl=https://valceaclar.ro/\nsource_sha=%s\nverified_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/cutover-status
          git add .github/cutover-status
          git commit -m 'ops: record verified production cutover'
          git push origin HEAD:main
