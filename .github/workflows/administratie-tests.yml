name: Administration module tests
on:
  pull_request:
    paths:
      - 'administratie/**'
      - 'tests/test_ramnicu_collector.py'
      - '.github/workflows/administratie-tests.yml'
  push:
    paths:
      - 'administratie/**'
      - 'tests/test_ramnicu_collector.py'
      - '.github/workflows/administratie-tests.yml'
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_ramnicu_collector.py' -v
