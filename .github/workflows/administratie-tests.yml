name: Administration module tests
on:
  pull_request:
    paths:
      - 'administratie/**'
      - 'deploy/windows/**'
      - 'tests/test_ramnicu*.py'
      - '.github/workflows/administratie-tests.yml'
  push:
    paths:
      - 'administratie/**'
      - 'deploy/windows/**'
      - 'tests/test_ramnicu*.py'
      - '.github/workflows/administratie-tests.yml'
permissions:
  contents: read
jobs:
  collector:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf==6.14.2
      - run: python -m unittest discover -s tests -p 'test_ramnicu*.py' -v
