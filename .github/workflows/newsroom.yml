name: newsroom-candidate-radar
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths:
      - 'newsroom/run-now'
permissions:
  contents: write
concurrency:
  group: newsroom-candidate-radar
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/newsroom.py cycle
      - run: python3 scripts/newsroom.py verify
      - name: persist material newsroom state
        run: |
          git config user.name 'valcea-clar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add newsroom/output newsroom/state
          if git diff --cached --quiet; then
            echo 'No material newsroom change.'
            exit 0
          fi
          git commit -m 'newsroom: persist candidate-only radar state'
          git push
