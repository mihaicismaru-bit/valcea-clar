name: deploy-verify-once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-verify-once.yml'
permissions:
  contents: write
  deployments: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify latest GitHub Pages deployment and live UX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$API/deployments?environment=github-pages&per_page=5" -o /tmp/deployments.json
          python3 - <<'PY' > /tmp/deploy-summary
          import json
          rows=json.load(open('/tmp/deployments.json'))
          if not rows:
              raise SystemExit('NO_GITHUB_PAGES_DEPLOYMENT')
          d=rows[0]
          print('deployment_id='+str(d['id']))
          print('deployment_sha='+d['sha'])
          print('deployment_created_at='+d['created_at'])
          PY
          DEPLOY_ID=$(sed -n 's/^deployment_id=//p' /tmp/deploy-summary)
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$API/deployments/$DEPLOY_ID/statuses?per_page=5" -o /tmp/statuses.json
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 https://valceaclar.ro/ -o /tmp/live.html
          grep -q 'continuous-story-first' /tmp/live.html
          grep -q 'Pe scurt' /tmp/live.html
          grep -q 'În Vâlcea, acum' /tmp/live.html
          python3 - <<'PY' > /tmp/deploy-status
          import json
          s=json.load(open('/tmp/statuses.json'))
          print('status=DEPLOY_VERIFY')
          print(open('/tmp/deploy-summary').read().strip())
          if s:
              print('deployment_state='+str(s[0].get('state')))
              print('deployment_environment_url='+str(s[0].get('environment_url')))
              print('deployment_status_created_at='+str(s[0].get('created_at')))
          else:
              print('deployment_state=NO_STATUS')
          print('live_url=https://valceaclar.ro/')
          print('live_continuous_story_first=PASS')
          print('live_headline_strip=PASS')
          print('live_valcea_now=PASS')
          PY
          cat /tmp/deploy-status
      - name: Persist verification
        run: |
          git config user.name 'valcea-clar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B deploy-verify-status origin/main
          cp /tmp/deploy-status .github/deploy-verify-status
          git add .github/deploy-verify-status
          git commit -m 'ops: record verified UX deployment'
          git push origin HEAD:main
