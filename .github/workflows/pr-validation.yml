name: PR validation harness
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build static site
        run: python3 scripts/build.py
      - name: Verify public site
        run: python3 scripts/verify.py
      - name: Build deterministic newsroom fixture
        run: python3 scripts/newsroom.py cycle --fixtures
      - name: Verify newsroom fail-closed policy
        run: python3 scripts/newsroom.py verify
      - name: Prove publisher is locked
        run: |
          if python3 scripts/newsroom.py publish; then
            echo 'publisher unexpectedly unlocked' >&2
            exit 1
          fi
