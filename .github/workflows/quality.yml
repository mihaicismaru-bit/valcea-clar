name: quality
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'content/site.css'
      - 'content/site.json'
      - 'content/legal.json'
      - 'content/media.json'
      - '.github/workflows/quality.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'content/**'
      - '.github/workflows/quality.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_civora_projection_ready.py --self-test
      - run: python3 scripts/check_civora_projection_ready.py
      - run: python3 scripts/sync_civora.py
      - run: python3 scripts/build.py
      - run: python3 scripts/history_projection.py --self-test
      - run: python3 scripts/history_projection.py
      - run: python3 scripts/enrich_metadata.py
      - run: python3 scripts/verify.py
