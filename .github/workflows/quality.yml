name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py
      - run: python3 scripts/verify.py
      - run: python3 scripts/newsroom.py cycle --fixtures
      - run: python3 scripts/newsroom.py verify
      - name: prove publisher is locked
        run: |
          if python3 scripts/newsroom.py publish; then
            echo 'publisher unexpectedly unlocked' >&2
            exit 1
          fi
