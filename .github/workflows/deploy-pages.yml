name: deploy-pages-manual
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY to allow a Pages deployment'
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Serialize recovery deployments with the canonical public writer.
  group: valcea-clar-civora-public-sync
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_civora_projection_ready.py
      - run: python3 scripts/sync_civora.py
      - name: Reconcile current stories and structured Local Life
        run: |
          python3 scripts/reconcile_civora_currentness_events.py --self-test
          python3 scripts/reconcile_civora_currentness_events.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py
      - run: python3 scripts/history_projection.py --self-test
      - run: python3 scripts/history_projection.py
      - run: python3 scripts/enrich_metadata.py
      - run: python3 scripts/verify.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
