name: cutover-diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/cutover-diagnostic-trigger'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose DNS and HTTPS
        run: |
          set +e
          {
            echo 'status=DIAGNOSTIC'
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '[APEX_A_AAAA]'
            getent ahosts valceaclar.ro
            echo '[WWW_A_AAAA]'
            getent ahosts www.valceaclar.ro
            echo '[APEX_HTTPS]'
            curl -sSIL --max-time 20 https://valceaclar.ro/ | head -20
            echo '[WWW_HTTPS]'
            curl -sSIL --max-time 20 https://www.valceaclar.ro/ | head -20
          } > /tmp/cutover-diagnostic 2>&1
          cat /tmp/cutover-diagnostic
      - name: Persist diagnostic
        if: always()
        run: |
          git config user.name 'valcea-clar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git checkout -B cutover-diagnostic-status origin/main
          cp /tmp/cutover-diagnostic .github/cutover-diagnostic-status
          git add .github/cutover-diagnostic-status
          git commit -m 'ops: record cutover diagnostic'
          git push origin HEAD:main
