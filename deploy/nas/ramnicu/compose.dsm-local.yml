# Copy this YAML into the existing valcea-clar-ramnicu-pilot project only
# after extracting the verified source archive directly into its directory.
# Not yet built or run on NAS; see DSM-ACCESS-20261016.md.
services:
  ramnicu-collector:
    build:
      context: .
      dockerfile: deploy/nas/ramnicu/Dockerfile
    user: "1000:1000"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ramnicu-evidence:/data
volumes:
  ramnicu-evidence:
